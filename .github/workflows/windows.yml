name: Windows build and verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Locked build and real ETL regression tests
        shell: pwsh
        run: ./scripts/test.ps1 -DownloadFixtures
      - name: Independent native CPU and disk reference checks
        shell: pwsh
        run: |
          dotnet tools/Woi.Reference/bin/Release/net10.0-windows/Woi.Reference.dll .artifacts/fixtures/net452/net.4.5.2.x64.etl .artifacts/validation/ci-reference-net452.json
          if ($LASTEXITCODE -ne 0) { throw "Native net452 reference checks failed." }
          dotnet tools/Woi.Reference/bin/Release/net10.0-windows/Woi.Reference.dll .artifacts/fixtures/allocator/SimpleAllocator-dotnet6.etl .artifacts/validation/ci-reference-allocator.json
          if ($LASTEXITCODE -ne 0) { throw "Native allocator reference checks failed." }
      - name: Package the self-contained desktop and capture helper
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Generated native ETL scale, completeness and over-limit rejection
        shell: pwsh
        run: |
          foreach ($case in @(@{Name="smoke";Count=1000}, @{Name="near-limit";Count=4990000}, @{Name="over-limit";Count=5010000})) {
            dotnet tools/Woi.Validation/bin/Release/net10.0-windows/Woi.Validation.dll --native-envelope ".artifacts/validation/ci-native-envelope/$($case.Name)" dist/WindowsOpenIntelligence/Woi.Worker.exe $case.Count
            if ($LASTEXITCODE -ne 0) { throw "Generated native ETL validation failed: $($case.Name)" }
          }
      - name: Both shipping capture profiles and report export
        shell: pwsh
        run: |
          dotnet publish tools/Woi.Workload -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -o .artifacts/workload
          ./scripts/native-capture-matrix.ps1 -OutputDirectory .artifacts/validation/ci-native-capture
          if ($LASTEXITCODE -ne 0) { throw "Real capture-to-report validation failed." }
      - name: Native capture deadline, cancellation, disconnect and recovery
        shell: pwsh
        run: dotnet tools/Woi.Validation/bin/Release/net10.0-windows/Woi.Validation.dll --capture-lifecycle .artifacts/validation/ci-capture-lifecycle dist/WindowsOpenIntelligence/Woi.Capture.exe
      - name: Five-million-observation aggregation stress
        shell: pwsh
        run: dotnet tools/Woi.Validation/bin/Release/net10.0-windows/Woi.Validation.dll --aggregate-stress .artifacts/validation/aggregate-stress.json
      - name: Packaged desktop smoke and worker recovery
        shell: pwsh
        run: |
          $app = Start-Process dist/WindowsOpenIntelligence/WindowsOpenIntelligence.exe -ArgumentList @("--smoke-test", ".artifacts/fixtures/allocator/SimpleAllocator-dotnet6.etl", ".artifacts/validation/desktop.png", "--verify-recovery", "--verify-monitor", "--verify-investigations") -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw "Desktop smoke timed out." }
          if ($app.ExitCode -ne 0) { throw "Desktop smoke failed." }
      - name: Unprivileged monitor continuity and overhead smoke
        shell: pwsh
        run: ./scripts/monitor-stress.ps1 -Seconds 30 -Output .artifacts/validation/ci-monitor-stress.json
      - name: Warmed headless monitor measurement
        shell: pwsh
        run: ./scripts/monitor-stress.ps1 -WarmupSeconds 30 -Seconds 120 -Output .artifacts/validation/ci-monitor-warm.json
      - name: Packaged replay stress
        shell: pwsh
        run: node scripts/stress.cjs dist/WindowsOpenIntelligence/Woi.Worker.exe .artifacts/validation/ci-stress.json 10 .artifacts/fixtures/net452/net.4.5.2.x64.etl .artifacts/fixtures/allocator/SimpleAllocator-dotnet6.etl
      - name: Upload test and stress reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            .artifacts/test-results/*.trx
            .artifacts/validation/*.json
            .artifacts/validation/ci-native-capture/**/*.json
            .artifacts/validation/ci-native-capture/**/*.md
            .artifacts/validation/ci-capture-lifecycle/**/*.json
            .artifacts/validation/ci-native-envelope/*/native-envelope.json
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: WindowsOpenIntelligence-win-x64
          path: |
            dist/WindowsOpenIntelligence-win-x64.zip
            dist/WindowsOpenIntelligence-win-x64.zip.sha256
